# Neues Release, zwei Wege:
#  - Actions → „Release“ → „Run workflow“ mit der Version (z.B. 2.1.0), oder
#  - annotierten Tag pushen (git tag -a v2.1.0 -F notizen.txt && git push origin v2.1.0).
# Baut das Fat-JAR und hängt es als AmongUsManager.jar ans Release. Notizen: release-notes/v<Version>.md,
# sonst die Tag-Nachricht.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version ohne v, z.B. 2.1.0"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: JAR bauen
        run: bash ./gradlew shadowJar --no-daemon
      - name: Release erstellen
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$INPUT_VERSION" ]; then TAG="v${INPUT_VERSION#v}"; else TAG="$GITHUB_REF_NAME"; fi
          NOTES="release-notes/$TAG.md"
          if [ -f "$NOTES" ]; then
            NOTES_ARGS=(--notes-file "$NOTES")
          else
            git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
            NOTES_ARGS=(--notes-from-tag)
          fi
          gh release create "$TAG" build/libs/AmongUsManager.jar --target "$GITHUB_SHA" \
            --title "Among Us Manager ${TAG#v}" "${NOTES_ARGS[@]}"
