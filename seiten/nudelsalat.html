<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#1a0f33">
<title>Nudelsalat – die Arena</title>
<style>
:root {
  --bg: #1a0f33; --card: #2a1856; --card2: #3a2170;
  --pink: #ff4fa3; --yellow: #ffd23f; --cyan: #3be8ff; --green: #5cff8a; --orange: #ff8a3d; --violet: #a46bff; --red: #ff4f5e;
  --ink: #fff7ec; --muted: #c9b8f0;
  --round: "Arial Rounded MT Bold", "Nunito", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: var(--round);
  -webkit-user-select: none; user-select: none; touch-action: none; -webkit-tap-highlight-color: transparent; }
canvas#game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; cursor: crosshair; }
button { font-family: inherit; cursor: pointer; }
.hidden { display: none !important; }

/* ---------- Menü ---------- */
.overlay { position: fixed; inset: 0; display: grid; place-items: center; padding: 16px; z-index: 10;
  background: radial-gradient(ellipse at center, rgba(26,15,51,.25), rgba(26,15,51,.75)); }
.menu { display: grid; grid-template-columns: minmax(0, 440px) minmax(0, 300px); gap: 18px; align-items: start; max-width: 100%; }
.card { background: var(--card); border-radius: 26px; padding: 22px 24px; border: 4px solid #000;
  box-shadow: 0 8px 0 #000, 0 0 0 4px rgba(255,255,255,.06) inset; position: relative; }
.card.main { transform: rotate(-1deg); }
.card.side { transform: rotate(1.5deg); background: var(--card2); }
h1.logo { margin: -6px 0 2px; font-weight: 900; font-size: clamp(38px, 8.5vw, 56px); line-height: 1; letter-spacing: 1px; text-align: center; white-space: nowrap; }
h1.logo span { display: inline-block; -webkit-text-stroke: 3px #000; paint-order: stroke fill; text-shadow: 0 5px 0 #000;
  animation: hop 1.6s ease-in-out infinite; }
@keyframes hop { 0%, 100% { transform: translateY(0) rotate(0); } 40% { transform: translateY(-10px) rotate(-6deg); } 60% { transform: translateY(2px) rotate(4deg); } }
.tag { text-align: center; color: var(--yellow); font-size: 15px; min-height: 40px; margin: 6px 0 14px; transition: opacity .3s; }
label.small { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 4px; text-transform: uppercase; letter-spacing: 1.5px; }
input#name { width: 100%; font: inherit; font-size: 22px; padding: 12px 16px; border-radius: 16px; border: 4px solid #000; background: #fff7ec;
  color: #2a1856; outline: none; box-shadow: 0 4px 0 #000; }
input#name:focus { background: #fff; box-shadow: 0 4px 0 #000, 0 0 0 4px var(--cyan); }
.skins { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 16px 0 6px; }
.skin { height: 34px; border-radius: 99px; border: 3px solid #000; padding: 0; position: relative; transition: transform .15s; box-shadow: 0 3px 0 #000; }
.skin:hover { transform: translateY(-3px) rotate(-4deg); }
.skin.on { transform: scale(1.12); box-shadow: 0 3px 0 #000, 0 0 0 3px var(--yellow); }
.skin::after { content: ""; position: absolute; right: 5px; top: 50%; width: 9px; height: 9px; margin-top: -5px; border-radius: 50%; background: #fff; box-shadow: inset 2px 0 0 2px #000; }
.skinname { text-align: center; font-size: 14px; color: var(--muted); height: 18px; margin-bottom: 14px; }
.go { width: 100%; font-size: 30px; padding: 14px; border-radius: 20px; border: 4px solid #000; color: #000; letter-spacing: 1px;
  background: linear-gradient(90deg, var(--yellow), var(--orange), var(--pink), var(--violet), var(--cyan), var(--green), var(--yellow));
  background-size: 300% 100%; animation: slide 4s linear infinite; box-shadow: 0 7px 0 #000; transition: transform .1s, box-shadow .1s; }
.go:hover { transform: translateY(-2px) rotate(-1deg); }
.go:active { transform: translateY(5px); box-shadow: 0 2px 0 #000; }
.go:disabled { filter: grayscale(1); cursor: wait; }
@keyframes slide { to { background-position: 300% 0; } }
.help { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin-top: 16px; font-size: 13px; color: var(--muted); }
.help b { color: var(--ink); background: #000; border-radius: 8px; padding: 2px 7px; }
.status { text-align: center; font-size: 13px; margin-top: 12px; color: var(--muted); }
.status .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--green); margin-right: 6px; box-shadow: 0 0 10px var(--green); animation: blink 1.2s infinite; }
.status.off .dot { background: var(--red); box-shadow: 0 0 10px var(--red); }
@keyframes blink { 50% { opacity: .35; } }
.side h2 { margin: 0 0 10px; font-size: 22px; color: var(--yellow); -webkit-text-stroke: 1px #000; }
ol.top { list-style: none; padding: 0; margin: 0; counter-reset: r; }
ol.top li { counter-increment: r; display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 12px; font-size: 16px; }
ol.top li:nth-child(odd) { background: rgba(0,0,0,.18); }
ol.top li::before { content: counter(r); width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; font-size: 14px;
  background: #000; color: var(--muted); flex: none; }
ol.top li:nth-child(1)::before { background: var(--yellow); color: #000; }
ol.top li:nth-child(2)::before { background: #dfe6ff; color: #000; }
ol.top li:nth-child(3)::before { background: var(--orange); color: #000; }
ol.top li.empty::before { display: none; }
ol.top li .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
ol.top li .s { color: var(--cyan); }
.empty { color: var(--muted); font-size: 14px; }
.back { display: inline-block; margin-top: 14px; font-size: 13px; color: var(--muted); text-decoration: none; }
.back:hover { color: var(--ink); }

/* ---------- Spiel-Anzeigen ---------- */
.hud { position: fixed; z-index: 5; pointer-events: none; }
.stats { left: 14px; top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
.pill { background: rgba(0,0,0,.55); border: 3px solid #000; border-radius: 14px; padding: 6px 12px; font-size: 15px; color: var(--muted); }
.pill b { color: var(--ink); font-size: 22px; margin-left: 4px; display: inline-block; }
.pill b.bump { animation: bump .35s; }
@keyframes bump { 40% { transform: scale(1.4) rotate(-6deg); color: var(--yellow); } }
.board { right: 14px; top: 14px; width: 230px; background: rgba(0,0,0,.5); border: 3px solid #000; border-radius: 16px; padding: 10px 12px; }
.board h3 { margin: 0 0 6px; font-size: 14px; color: var(--yellow); letter-spacing: 1.5px; text-transform: uppercase; }
.board .row { display: flex; gap: 8px; font-size: 14px; line-height: 1.55; }
.board .row .r { width: 22px; color: var(--muted); text-align: right; }
.board .row .n { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.board .row .s { color: var(--cyan); }
.board .row.me { color: var(--yellow); }
.board .row.me .s { color: var(--yellow); }
.board .row .bot { font-size: 10px; background: rgba(255,255,255,.15); border-radius: 5px; padding: 0 4px; margin-left: 4px; vertical-align: 2px; color: var(--muted); }
.feed { right: 14px; top: 300px; width: 280px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; }
.feed div { background: rgba(0,0,0,.55); border-radius: 10px; padding: 4px 10px; font-size: 13px; animation: feedin .3s ease-out; text-align: right; transition: opacity .6s; }
.feed div.mine { background: var(--pink); color: #000; }
@keyframes feedin { from { transform: translateX(40px) scale(.8); opacity: 0; } }
canvas#mini { position: fixed; right: 14px; bottom: 14px; width: 150px; height: 150px; z-index: 5; pointer-events: none; }
.boostbtn { position: fixed; left: 20px; bottom: 26px; z-index: 6; width: 92px; height: 92px; border-radius: 50%; border: 4px solid #000;
  background: radial-gradient(circle at 35% 30%, #fff6, transparent 40%), var(--pink); color: #000; font-size: 18px; box-shadow: 0 6px 0 #000; }
.boostbtn.on { transform: translateY(4px) scale(.95); box-shadow: 0 2px 0 #000; background-color: var(--yellow); }
.pop { position: fixed; left: 50%; top: 26%; z-index: 7; pointer-events: none; font-size: clamp(36px, 7vw, 64px); white-space: nowrap;
  -webkit-text-stroke: 3px #000; paint-order: stroke fill; text-shadow: 0 6px 0 #000; animation: pop 1.3s cubic-bezier(.2,1.6,.4,1) forwards; }
@keyframes pop { 0% { transform: translate(-50%, 0) scale(0) rotate(-20deg); opacity: 1; } 25% { transform: translate(-50%, 0) scale(1.1) rotate(4deg); }
  70% { transform: translate(-50%, -10px) scale(1) rotate(-2deg); opacity: 1; } 100% { transform: translate(-50%, -60px) scale(.9); opacity: 0; } }

/* ---------- Tot ---------- */
.dead .card { text-align: center; max-width: 460px; transform: rotate(-1.5deg); animation: drop .5s cubic-bezier(.2,1.5,.4,1); }
@keyframes drop { from { transform: translateY(-80px) rotate(8deg) scale(.6); opacity: 0; } }
.dead .big { font-size: clamp(34px, 7vw, 54px); margin: 0; -webkit-text-stroke: 2px #000; paint-order: stroke fill; color: var(--red); text-shadow: 0 5px 0 #000; }
.dead .why { font-size: 18px; color: var(--ink); margin: 10px 0 16px; }
.dead .nums { display: flex; justify-content: center; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.dead .nums .pill { pointer-events: none; }
.dead .record { color: var(--yellow); font-size: 16px; margin: -6px 0 14px; min-height: 20px; }
.dead .again { display: flex; gap: 10px; }
.dead .again .go { font-size: 24px; }
.dead .again .menu-btn { flex: none; width: 120px; font-size: 18px; border-radius: 20px; border: 4px solid #000; background: var(--card2); color: var(--ink); box-shadow: 0 7px 0 #000; }

@media (max-width: 760px) {
  .menu { grid-template-columns: minmax(0, 1fr); width: min(440px, 100%); }
  .card.side { display: none; }
  .board { width: 160px; padding: 6px 8px; }
  .board .row { font-size: 12px; }
  .board .row:nth-child(n+7) { display: none; }
  .board h3 { font-size: 11px; }
  .stats { flex-direction: column; gap: 5px; left: 10px; top: 10px; }
  .pill { padding: 3px 9px; font-size: 12px; border-width: 2px; }
  .board { right: 10px; top: 10px; border-width: 2px; }
  .feed { display: none; }
  canvas#mini { width: 96px; height: 96px; }
  .pill b { font-size: 16px; }
}
@media (hover: hover) and (pointer: fine) { .boostbtn, .help.touch { display: none; } }
@media (hover: none) { .help.desk { display: none; } }
@media (prefers-reduced-motion: reduce) { h1.logo span, .go { animation: none; } }
</style>
</head>
<body>
<canvas id="game"></canvas>
<canvas id="mini" class="hidden"></canvas>

<div class="hud stats hidden" id="stats">
  <div class="pill">Punkte<b id="sLen">0</b></div>
  <div class="pill">Platz<b id="sRank">–</b></div>
  <div class="pill">Gefressen<b id="sKills">0</b></div>
</div>
<div class="hud board hidden" id="board"><h3>Gerade fett</h3><div id="boardRows"></div></div>
<div class="hud feed hidden" id="feed"></div>
<button class="boostbtn hidden" id="boostBtn">BOOST</button>

<div class="overlay" id="menu">
  <div class="menu">
    <div class="card main">
      <h1 class="logo" id="logo"></h1>
      <div class="tag" id="tag"></div>
      <label class="small" for="name">Dein Name</label>
      <input id="name" maxlength="16" autocomplete="off" spellcheck="false" placeholder="z.B. Spaghettimonster">
      <div class="skins" id="skins"></div>
      <div class="skinname" id="skinName"></div>
      <button class="go" id="play" disabled>Verbinde …</button>
      <div class="help desk"><span><b>Maus</b> lenken</span><span><b>Klick</b> / <b>Leertaste</b> boosten</span><span>Boost kostet Länge</span></div>
      <div class="help touch"><span><b>Tippen</b> lenkt</span><span><b>BOOST</b>-Knopf halten</span><span>Boost kostet Länge</span></div>
      <div class="status off" id="status"><span class="dot"></span><span id="statusText">Verbinde mit der Arena …</span></div>
    </div>
    <div class="card side">
      <h2>Ewige Bestenliste</h2>
      <ol class="top" id="topList"></ol>
      <a class="back" href="/">← zurück zu CrewStats</a>
    </div>
  </div>
</div>

<div class="overlay dead hidden" id="dead">
  <div class="card">
    <p class="big" id="deadBig">SKILL ISSUE</p>
    <p class="why" id="deadWhy"></p>
    <div class="nums">
      <div class="pill">Punkte<b id="dLen">0</b></div>
      <div class="pill">Gefressen<b id="dKills">0</b></div>
      <div class="pill">Überlebt<b id="dTime">0s</b></div>
    </div>
    <div class="record" id="dRecord"></div>
    <div class="again">
      <button class="go" id="again">Nochmal!</button>
      <button class="menu-btn" id="toMenu">Menü</button>
    </div>
  </div>
</div>

<script>
"use strict";
// ======================================================================
// Nudelsalat – Schlangen-Arena. Der Server rechnet alles (Bewegung, Fressen, Zusammenstöße),
// diese Seite zeigt nur an und schickt Richtung + Boost. Protokoll: siehe NoodleGame.kt.
// ======================================================================
const API = "/api/nudelsalat";
const SKINS = [
  { name: "Ketchup-Kalle", a: "#ff3b4e", b: "#ffd23f" },
  { name: "Pesto-Paul", a: "#4cd964", b: "#1d7a35" },
  { name: "Schlumpfnudel", a: "#3b8bff", b: "#bfe0ff" },
  { name: "Bananenmilch", a: "#ffe14d", b: "#fff8d6" },
  { name: "Lila Laune", a: "#a259ff", b: "#ff7ad9" },
  { name: "Matrix", a: "#0e3b1d", b: "#39ff6a" },
  { name: "Feuerwehr", a: "#ff6a00", b: "#262626" },
  { name: "Zahnpasta", a: "#3dffd0", b: "#ffffff" },
  { name: "Pfirsich", a: "#ffb38a", b: "#ff6f91" },
  { name: "Discord-Mod", a: "#5865f2", b: "#ffffff" },
  { name: "Zebra", a: "#f4f4f4", b: "#1e1e1e" },
  { name: "Einhorn-Kotze", a: "#ff4fa3", b: "#3be8ff", rainbow: true },
];
const RAINBOW = ["#ff4f5e", "#ff9f3b", "#ffe14d", "#4cd964", "#3be8ff", "#7a6bff", "#ff4fa3"];
const TAGLINES = [
  "Wie Snake, nur mit mehr Drama.",
  "Garantiert 0 % Weizen, 100 % Skill Issue.",
  "Der Tellerrand ist nicht dein Freund.",
  "Die Bots heißen Kevin. Sei nicht wie Kevin.",
  "Boost kostet Länge. Gier kostet alles.",
  "Vom Erfinder von „Ich war in Elektro“.",
  "Heute schon jemanden al dente gemacht?",
  "Wer bremst, verliert. Wer boostet, auch.",
];
const DEATH_BIG = ["SKILL ISSUE", "GG EZ", "WASTED", "OOF", "RIP BOZO", "AUTSCH", "NOPE"];
const DEATH_BY = [
  "{k} hat dich zu Bolognese verarbeitet.",
  "Gegessen von {k}. Al dente.",
  "{k} sagt danke für die Krümel.",
  "Du bist in {k} reingefahren. Mutig. Dumm, aber mutig.",
  "{k} hat dich weggeschlürft wie die letzte Nudel.",
];
const DEATH_WALL = ["Der Tellerrand war's. Wie immer.", "Rand geküsst. Rand hat nicht zurückgeküsst.", "Lag. Ganz sicher war das Lag."];
const FEED_KILL = ["{k} hat {v} vernascht", "{v} ist in {k} reingefahren", "{k} schlürft {v}", "{v} → Krümel (danke {k})"];
const FEED_WALL = ["{v} hat den Tellerrand geküsst", "{v} wollte über den Rand", "{v}: Rand 1, {v} 0"];
const KILL_POPS = ["NOM NOM!", "LECKER!", "GESCHLÜRFT!", "NICE!", "AL DENTE!", "ERWISCHT!"];

// ---------- Zustand ----------
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
const mini = document.getElementById("mini");
const mctx = mini.getContext("2d");
let W = 0, H = 0, DPR = 1;
let es = null, token = null, R = 2400, tickMs = 50, lastTick = performance.now();
const snakes = new Map();
const foods = new Map();
let bestList = [];
let myId = null, playing = false, joining = false, myKills = 0, bornAt = 0, follow = null, followUntil = 0;
let angle = 0, boost = false, keyBoost = false;
let cam = { x: 0, y: 0, z: 1 };
let shake = 0;
const flying = [], particles = [], floaters = [];
let feedTimer = 0, bossShown = false;

// ---------- Hilfen ----------
const $ = (id) => document.getElementById(id);
const radiusOf = (len) => 8 + Math.min(14, Math.sqrt(len) / 5.5);
const scoreOf = (len) => Math.round(len / 2);
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const fill = (text, k, v) => text.replaceAll("{k}", k).replaceAll("{v}", v);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function esc(text) { const d = document.createElement("div"); d.textContent = text; return d.innerHTML; }

function makeSnake(id, name, skin, bot) {
  return { id, name, skin: SKINS[skin] || SKINS[0], skinNo: skin, bot: !!bot, len: 160, boost: 0,
    xs: [], ys: [], seg: [], start: 0, total: 0, cut: 0, px: null, py: null, hx: 0, hy: 0, dir: 0, eatPulse: 0 };
}
function addPoint(s, x, y) {
  const n = s.xs.length;
  const step = n > s.start ? Math.hypot(x - s.xs[n - 1], y - s.ys[n - 1]) : 0;
  if (n > s.start && step > 0.01) s.dir = Math.atan2(y - s.ys[n - 1], x - s.xs[n - 1]);
  s.xs.push(x); s.ys.push(y); s.seg.push(step); s.total += step;
}
function trim(s) {
  while (s.xs.length - s.start > 2 && s.total - s.seg[s.start + 1] >= s.len) {
    s.total -= s.seg[s.start + 1];
    s.cut += s.seg[s.start + 1];
    s.start++;
    s.seg[s.start] = 0;
  }
  if (s.start > 512 && s.start > s.xs.length / 2) {
    s.xs = s.xs.slice(s.start); s.ys = s.ys.slice(s.start); s.seg = s.seg.slice(s.start); s.start = 0;
  }
}

// ---------- Verbindung ----------
function connect() {
  if (es) es.close();
  setStatus(false, "Verbinde mit der Arena …");
  es = new EventSource(API + "/stream");
  es.onmessage = (e) => {
    let m;
    try { m = JSON.parse(e.data); } catch { return; }
    if (m.t === "init") onInit(m);
    else if (m.t === "s") onStep(m);
    else if (m.t === "bye") onBye(m);
  };
  es.onerror = () => {
    setStatus(false, "Verbindung weg – versuche es gleich nochmal …");
    $("play").disabled = true;
    $("play").textContent = "Verbinde …";
  };
}
function onInit(m) {
  const wasPlaying = playing;
  token = m.k; R = m.r; tickMs = m.tick || 50;
  snakes.clear(); foods.clear();
  for (const [id, name, skin, bot, len, b, path] of m.snakes) {
    const s = makeSnake(id, name, skin, bot);
    for (let i = 0; i < path.length; i += 2) addPoint(s, path[i], path[i + 1]);
    s.len = len; s.boost = b; trim(s);
    s.hx = s.xs[s.xs.length - 1]; s.hy = s.ys[s.ys.length - 1];
    snakes.set(id, s);
  }
  const f = m.food;
  for (let i = 0; i < f.length; i += 5) addFood(f[i], f[i + 1], f[i + 2], f[i + 3], f[i + 4]);
  setTop(m.top);
  lastTick = performance.now();
  setStatus(true, "Arena läuft");
  $("play").disabled = false;
  $("play").textContent = "LOS GEHT'S";
  myId = null;
  if (wasPlaying) die(null, "Verbindung kurz weg – deine Nudel ist leider verdunstet.");
}
function onBye(m) {
  es.close(); es = null; token = null;
  setStatus(false, m.why === "idle" ? "Zu lange rumgestanden – zum Verbinden auf „Los“ drücken." : "Zu langsame Verbindung – zum Verbinden auf „Los“ drücken.");
  $("play").disabled = false; $("play").textContent = "Neu verbinden";
  if (playing) die(null, "Verbindung zu langsam – der Server hat dich rausgeschmissen.");
}
function addFood(id, x, y, c, v) {
  const skin = SKINS[c] || SKINS[0];
  foods.set(id, { id, x, y, color: skin.rainbow ? pick(RAINBOW) : (Math.random() < 0.5 ? skin.a : skin.b === "#ffffff" || skin.b === "#1e1e1e" || skin.b === "#262626" ? skin.a : skin.b),
    v, r: 3.2 + Math.sqrt(v) * 1.5, phase: Math.random() * 6.28, born: performance.now() });
}
function onStep(m) {
  const now = performance.now();
  const gap = now - lastTick;
  if (gap > 10 && gap < 200) tickMs = tickMs * 0.9 + gap * 0.1;
  lastTick = now;
  if (m.n) for (const [id, name, skin, bot] of m.n) if (!snakes.has(id)) snakes.set(id, makeSnake(id, name, skin, bot));
  const s = m.s;
  for (let i = 0; i < s.length; i += 5) {
    const sn = snakes.get(s[i]);
    if (!sn) continue;
    const fresh = sn.xs.length === 0;
    sn.px = fresh ? s[i + 1] : sn.hx; sn.py = fresh ? s[i + 2] : sn.hy;
    addPoint(sn, s[i + 1], s[i + 2]);
    sn.hx = s[i + 1]; sn.hy = s[i + 2];
    const grew = s[i + 3] > sn.len;
    sn.len = s[i + 3]; sn.boost = s[i + 4];
    trim(sn);
    if (sn.id === myId && grew) bumpLen();
  }
  if (m.fr) for (let i = 0; i < m.fr.length; i += 2) {
    const food = foods.get(m.fr[i]);
    if (!food) continue;
    foods.delete(food.id);
    const eater = snakes.get(m.fr[i + 1]);
    if (eater && flying.length < 400) { flying.push({ x: food.x, y: food.y, r: food.r, color: food.color, to: eater, t: 0 }); eater.eatPulse = 1; }
  }

function burst(s) {

  }

  }

let fontCache = null;
function drawSnake(s, alpha, t, left, topY, right, bottom) {

  const r = radiusOf(s.len);

  for (let i = n - 1; i >= s.start; i -= 6) {

  }
  if (!visible) return;
  const path = new Path2D();
  path.moveTo(s.xs[s.start], s.ys[s.start]);
  for (let i = s.start + 1; i < n - 1; i++) path.lineTo(s.xs[i], s.ys[i]);

    span.style.animationDelay = (i * 0.09) + "s";
    logo.appendChild(span);
  });
  const box = $("skins");
  SKINS.forEach((s, i) => {
    const b = document.createElement("button");
    b.className = "skin";
    b.title = s.name;
    b.style.background = s.rainbow ? `linear-gradient(90deg, ${RAINBOW.join(",")})` : `repeating-linear-gradient(90deg, ${s.a} 0 12px, ${s.b} 12px 20px)`;
    b.addEventListener("click", () => { skinNo = i; markSkin(); });
    box.appendChild(b);
  });
  markSkin();
  $("name").value = localStorage.getItem("nudelsalat.name") || "";
  let tag = Math.floor(Math.random() * TAGLINES.length);
  $("tag").textContent = TAGLINES[tag];
  setInterval(() => {
    const el = $("tag");
    el.style.opacity = "0";
    setTimeout(() => { tag = (tag + 1) % TAGLINES.length; el.textContent = TAGLINES[tag]; el.style.opacity = "1"; }, 300);
  }, 4200);
  setTop([]);
}
function markSkin() {
  [...$("skins").children].forEach((b, i) => b.classList.toggle("on", i === skinNo));
  $("skinName").textContent = "Skin: " + SKINS[skinNo].name;
}

buildMenu();
resize();
connect();
requestAnimationFrame(frame);
</script>
</body>
</html>
